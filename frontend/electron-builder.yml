appId: com.chaoxing.assistant
productName: 超星助手
copyright: Copyright © 2024

directories:
  output: release
  buildResources: build

files:
  - dist
  - dist-electron
  - build/icon.ico

# Ship the Python backend alongside the app as read-only resources. At runtime
# backendPath.ts resolves CODE_DIR = resources/backend (spawn cwd) and seeds a
# writable workspace under userData. Python itself is NOT bundled — the README
# documents the Python 3.10+ / pip install requirement.
#
# Excluded from the bundle:
#   passwords/      user creates these post-install (never ship credentials)
#   output/ temp/ logs/   runtime-generated, regenerated on demand
#   .playwright-cli/      local CLI cache, not needed in the package
#   **/__pycache__/       compiled bytecode, regenerated by the interpreter
# scripts/ IS shipped — it holds the read-only assets (_table.json,
# _decrypt_font.js, _v17_section_player.js) that first-launch seeding copies
# into the workspace.
extraResources:
  - from: ../backend
    to: backend
    filter:
      - "**/*"
      - "!passwords/**"
      - "!output/**"
      - "!temp/**"
      - "!logs/**"
      - "!.playwright-cli/**"
      - "!**/__pycache__/**"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
